services:
  exploreuk:
    command: /usr/local/bin/entrypoint.sh
    build:
      context: .
      # This docker-compose is for development purposes
      target: development
    volumes:
      - ./app/application:/app/application
      - ./app/assets:/app/assets
      - ./app/catalog.php:/app/catalog.php
      - ./assets/frontpage-assets/files:/app/files
      # Bind mount for dev, baked in image for production
      - ./php-fpm/php.ini-development:/usr/local/etc/php/conf.d/php.ini
      - ./phpunit.xml:/phpunit.xml
      - ./tests:/tests
    env_file:
      - .env.dev
    networks:
      - app_network

  web:
    image: nginx:1.29.0
    restart: always
    env_file:
      - .env.dev
    ports:
      - "8080:80"
    volumes:
      - ./assets/frontpage-assets/files:/app/files
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./app/application:/app/application
      - ./app/assets:/app/assets
      - ./app/catalog.php:/app/catalog.php
      - findingaid:/opt/findingaid
    depends_on:
      - exploreuk
    networks:
      - app_network

  findingaid:
    profiles:
      - with_fa
    env_file:
      - .env.dev
    # Pass in which findinagid image as an environment variable
    image: ${FA_IMAGE}
    volumes:
      - findingaid:/opt/findingaid
      - ./xml:/opt/findingaid/xml:ro
    networks:
      - app_network
    restart: unless-stopped


volumes:
  findingaid:

networks:
  app_network:
    driver: bridge
