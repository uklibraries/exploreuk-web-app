name: Publish acceptance build
on:
  pull_request:
    branches: [ main ]
    types: [ labeled, synchronize, reopened ]

permissions:
  contents: read
  packages: write

concurrency:
  group: acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'acceptance')
      && (github.event.action != 'labeled' || github.event.label.name == 'acceptance')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR head, not the merge commit; deploy.sh finds the image by head commit
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (ghcr)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/exploreuk-web-app:${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}

      - name: Record source commit and digest
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Acceptance build for PR #$PR"
            echo "- Commit: \`$SHA\`"
            echo "- Image: \`ghcr.io/${{ github.repository_owner }}/exploreuk-web-app@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
